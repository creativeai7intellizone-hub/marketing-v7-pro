name: Quality Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check core files
        run: |
          test -f index.html
          test -f CNAME
          test -d assets
          test -d css
          test -d js
          test -d data
          echo "KaiumMarketing structure OK"
